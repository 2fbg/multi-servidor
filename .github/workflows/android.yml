name: Android CI/CD



on:

  push:
  
    branches:
    
      - main
      
    tags:
    
      - "v*"
      
  pull_request:
  
    branches:
    
      - main
      
  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  validate-and-build:
  
    name: Validate and build APK
    
    runs-on: ubuntu-latest
    


    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        


      - name: Setup pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: 9.12.0
          


      - name: Setup Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: pnpm
          


      - name: Setup Java
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: "21"
          
          cache: gradle
          


      - name: Setup Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Install Android SDK packages
      
        run: |
        
          yes | sdkmanager --licenses || true
          
          sdkmanager \
          
            "platform-tools" \
            
            "platforms;android-36" \
            
            "build-tools;36.0.0" \
            
            "ndk;27.1.12297006"
            


      - name: Install JavaScript dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Typecheck
      
        run: pnpm check
        


      - name: Unit tests
      
        run: pnpm test
        


      - name: Lint
      
        run: pnpm lint
        


      - name: Generate Android native project
      
        run: npx expo prebuild --platform android --non-interactive --no-install
        


      - name: Build release APK
      
        working-directory: android
        
        run: ./gradlew assembleRelease --no-daemon
        


      - name: Rename APK
      
        run: cp android/app/build/outputs/apk/release/app-release.apk multi-servidor-${{ github.sha }}.apk
        


      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: multi-servidor-apk-${{ github.sha }}
          
          path: multi-servidor-${{ github.sha }}.apk
          
          retention-days: 30
          


      - name: Create GitHub release
      
        if: startsWith(github.ref, 'refs/tags/v')
        
        uses: softprops/action-gh-release@v2
        
        with:
        
          generate_release_notes: true
          
          files: multi-servidor-${{ github.sha }}.apk
          




































































